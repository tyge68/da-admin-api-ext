name: Release
# Push a tag like v0.2.0 to build the extension and attach the zip to a GitHub release.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Set manifest version from tag
        run: |
          node -e "
            const fs = require('fs');
            const p = 'public/manifest.json';
            const m = JSON.parse(fs.readFileSync(p, 'utf8'));
            m.version = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            fs.writeFileSync(p, JSON.stringify(m, null, 2) + '\n');
          "
      - run: npm run build
      - name: Package
        run: cd dist && zip -r "../da-admin-api-ext-${GITHUB_REF_NAME}.zip" .
      - uses: softprops/action-gh-release@v2
        with:
          files: da-admin-api-ext-${{ github.ref_name }}.zip
          generate_release_notes: true
